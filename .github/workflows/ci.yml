name: CI

on:
  push:
    branches: [development]
    paths:
      - frontend/**
      - bazarr/**
      - libs/**
      - migrations/**
      - bazarr.py
      - requirements.txt
      - dev-requirements.txt
      - .github/workflows/ci.yml
  pull_request:
    branches: [development]

env:
  ROOT_DIRECTORY: .
  UI_DIRECTORY: ./frontend
  SCRIPTS_DIRECTORY: .github/scripts
  UI_ARTIFACT_NAME: ui

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ env.UI_DIRECTORY }}/package-lock.json"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          HUSKY: 0

      - name: Check Styles
        run: npm run check
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check CSS/SCSS
        run: npm run check:style
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check Format
        run: npm run check:fmt
        working-directory: ${{ env.UI_DIRECTORY }}

  Types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ env.UI_DIRECTORY }}/package-lock.json"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          HUSKY: 0

      - name: Check Types
        run: npm run check:ts
        working-directory: ${{ env.UI_DIRECTORY }}

  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ env.UI_DIRECTORY }}/package-lock.json"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          HUSKY: 0

      - name: Unit Test
        run: npm test
        working-directory: ${{ env.UI_DIRECTORY }}

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ env.UI_DIRECTORY }}/package-lock.json"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          HUSKY: 0

      - name: Build
        run: npm run build:ci
        working-directory: ${{ env.UI_DIRECTORY }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: "${{ env.UI_DIRECTORY }}/build"

  Backend:
    runs-on: ubuntu-latest
    needs: Build

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    name: Python ${{ matrix.python-version }} backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UI
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: "${{ env.UI_DIRECTORY }}/build"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r dev-requirements.txt

      - name: Install media binaries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mediainfo

      - name: Test with pytest
        run: pytest tests/bazarr/ --junitxml report.xml

      - name: Test report generation
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Pytest Tests
          path: report.xml
          reporter: java-junit

      - name: Bazarr execution test
        run: |
          bash '${{ env.SCRIPTS_DIRECTORY }}/build_test.sh'

  Outcome:
    runs-on: ubuntu-latest
    needs: Backend
    if: ${{ always() }}
    steps:
      - name: Save outcome
        run: echo "${{ needs.Backend.result }}" > outcome.txt

      - name: Upload outcome as artifact
        uses: actions/upload-artifact@v7
        with:
          name: shared-metadata
          path: outcome.txt
