app:
  hostname: 0.0.0.0
  port: 2875
  database_url: sqlite://sqlite/autopulse.db
  log_level: info

# Basic auth (required for manual trigger endpoint)
auth:
  username: admin
  password: password

# Minimal configuration for Bazarr integration
# Bazarr uses the manual trigger endpoint, so no Plex configuration is needed
triggers:
  bazarr-manual:
    type: manual
