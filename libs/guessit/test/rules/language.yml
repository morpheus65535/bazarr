# Multiple input strings having same expected results can be chained.
# Use - marker to check inputs that should not match results.
? +English
? .ENG.
: language: English

? +French
: language: French

? +SubFrench
? +SubFr
? +STFr
? ST.FR
: subtitle_language: French

? +ENG.-.sub.FR
? ENG.-.FR Sub
? +ENG.-.SubFR
? +ENG.-.FRSUB
? +ENG.-.FRSUBS
? +ENG.-.FR-SUBS
: language: English
  subtitle_language: French

? "{Fr-Eng}.St{Fr-Eng}"
? "Le.Prestige[x264.{Fr-Eng}.St{Fr-Eng}.Chaps].mkv"
: language: [French, English]
  subtitle_language: [French, English]

? +ENG.-.sub.SWE
? ENG.-.SWE Sub
? +ENG.-.SubSWE
? +ENG.-.SWESUB
? +ENG.-.sub.SV
? ENG.-.SV Sub
? +ENG.-.SubSV
? +ENG.-.SVSUB
: language: English
  subtitle_language: Swedish

? The English Patient (1996)
: title: The English Patient
  -language: english

? French.Kiss.1995.1080p
: title: French Kiss
  -language: french

# --- #668: a language glued to a subtitle extension is kept even if it is a common word ---
# ".no.srt" -> Norwegian subtitle (was dropped by RemoveInvalidLanguages as the common word "no")
? Show.S01E01.DBRETAiL.no.srt
: subtitle_language: Norwegian
  episode_title: DBRETAiL

# but the same common-word code before a video extension is still filtered out
? Show.S01E01.DBRETAiL.no.mkv
: -subtitle_language: Norwegian
  -language: Norwegian

# but a Title-Case token before a subtitle extension is the last title word, not a language
# ("Dr.No.srt" = the film *Dr. No*, not Norwegian subtitles)
? Dr.No.srt
: title: Dr No
  -subtitle_language: Norwegian

? Garfield.It.srt
: title: Garfield It
  -subtitle_language: it

# regression anchor (#668): a lowercase language code before a subtitle extension is kept
? Show.S01E01.Some.Title.it.srt
: subtitle_language: Italian
  episode_title: Some Title

# anchor (#668 boundary): the common-word filter still suppresses a stray language code mid-name
# in a video file — only a subtitle extension (or a non-common code) keeps it
? Show.no.Way.Home.2021.1080p.mkv
: title: Show no Way Home
  -language: Norwegian
  -subtitle_language: Norwegian

# anchor: a real (non-common-word) language is unaffected by the filter
? Show.S01E01.German.1080p.WEB-DL.mkv
: language: German
