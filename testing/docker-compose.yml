# Bazarr Parallel Tasks Feature - Test Deployment
#
# Quick Start:
#   docker compose up -d
#
# Or pull from GitHub Container Registry (when available):
#   docker compose pull && docker compose up -d
#
# To view logs:
#   docker compose logs -f
#
# To stop:
#   docker compose down

services:
  bazarr:
    # Option 1: Build locally from this branch
    build:
      context: ..
      dockerfile: testing/Dockerfile

    # Option 2: Use pre-built image (uncomment when published)
    # image: ghcr.io/enoch85/bazarr:parallel-tasks-test

    container_name: bazarr-parallel-test

    ports:
      - "6767:6767"

    volumes:
      # Configuration - maps to your existing Bazarr config
      - ./config:/config

      # Media paths - adjust these to match YOUR setup
      # - /path/to/movies:/movies
      # - /path/to/tv:/tv

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
